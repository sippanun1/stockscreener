name: Fetch Thailand Market Data

on:
  # Run at 10:00, 12:45, 14:30, and 16:45 ICT - Thailand market sessions
  # schedule:
  #   - cron: '15 3 * * 1-5'  # 10:15 ICT - Before morning session
  #   - cron: '0 4 * * 1-5'  # 11:00 ICT
  #   - cron: '45 5 * * 1-5'  # 12:45 ICT - Mid-day
  #   - cron: '0 6 * * 1-5'  # 13:00 ICT
  #   - cron: '45 7 * * 1-5'  # 14:45 ICT - Before afternoon session
  #   - cron: '30 8 * * 1-5'  # 15:30 ICT
  #   - cron: '45 9 * * 1-5'  # 16:45 ICT - After market closes
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  fetch-th-market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          lfs: false
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Fetch Thailand market data
        id: fetch
        run: |
          cd backend
          python src/main.py --market TH --once 2>&1 | tee fetch_log.txt
        env:
          PYTHONPATH: src
          TZ: Asia/Bangkok
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        continue-on-error: true
      
      - name: Validate data
        if: steps.fetch.outcome == 'success'
        run: |
          cd backend
          python -c "
          import json
          import sys
          from pathlib import Path
          from datetime import datetime
          
          today = datetime.now().strftime('%Y-%m-%d')
          file_path = Path('data') / f'TH_{today}.json'
          
          if file_path.exists():
              with open(file_path) as f:
                  data = json.load(f)
                  print(f'✅ Thailand: {len(data)} stocks fetched')
                  if len(data) < 100:
                      print(f'⚠️  Warning: Only {len(data)} stocks (expected >100)')
                      sys.exit(1)
          else:
              print('❌ Thailand data file not found')
              sys.exit(1)
          "
      

      
      # - name: Commit and push database
      #   if: steps.fetch.outcome == 'success'
      #   run: |
      #     echo "Database updated locally (pushed to Supabase direct)"
      
      - name: Create summary
        if: always()
        run: |
          echo "## 🇹🇭 Thailand Market Fetch" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.fetch.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Fetch Details" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep ">>" backend/fetch_log.txt >> $GITHUB_STEP_SUMMARY || echo "No logs captured" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
