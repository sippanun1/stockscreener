name: Fetch Hong Kong Market Data

on:
  # Run at 08:45, 11:15, 12:15, 15:15, and 17:15 ICT - Hong Kong market sessions
  schedule:
    - cron: '45 1 * * 1-5'  # 08:45 ICT    market opens
    - cron: '30 2 * * 1-5'  # 09:30 ICT
    - cron: '30 3 * * 1-5'  # 10:30 ICT
    - cron: '15 4 * * 1-5'  # 11:15 ICT    After market closes
    - cron: '15 5 * * 1-5'  # 12:15 ICT    market opens
    - cron: '0 6 * * 1-5'  # 13:00 ICT
    - cron: '0 7 * * 1-5'  # 14:00 ICT
    - cron: '15 8 * * 1-5'  # 15:15 ICT    After market closes
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  fetch-hk-market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          lfs: false
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Fetch Hong Kong market data
        id: fetch
        run: |
          cd backend
          python main.py --market HK --once 2>&1 | tee fetch_log.txt
        env:
          TZ: Asia/Hong_Kong
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        continue-on-error: true
      
      - name: Validate data
        if: steps.fetch.outcome == 'success'
        run: |
          cd backend
          python -c "
          import json
          import sys
          from pathlib import Path
          from datetime import datetime
          
          today = datetime.now().strftime('%Y-%m-%d')
          file_path = Path('data') / f'HK_{today}.json'
          
          if file_path.exists():
              with open(file_path) as f:
                  data = json.load(f)
                  print(f'✅ Hong Kong: {len(data)} stocks fetched')
                  if len(data) < 100:
                      print(f'⚠️  Warning: Only {len(data)} stocks (expected >100)')
                      sys.exit(1)
          else:
              print('❌ Hong Kong data file not found')
              sys.exit(1)
          "
      

      
      # - name: Commit and push database
      #   if: steps.fetch.outcome == 'success'
      #   run: |
      #     echo "Database updated locally (pushed to Supabase direct)"
      
      - name: Create summary
        if: always()
        run: |
          echo "## 🇭🇰 Hong Kong Market Fetch" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.fetch.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Fetch Details" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep ">>" backend/src/fetch_log.txt >> $GITHUB_STEP_SUMMARY || echo "No logs captured" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
