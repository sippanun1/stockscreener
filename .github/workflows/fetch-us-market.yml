name: Fetch US Market Data

on:
  # Run at 21:30 ICT (14:30 UTC) - Pre-open and 04:15 ICT (21:15 UTC) - Post-market
  # schedule:
  #   - cron: '30 14 * * 1-5'  # 21:30 ICT - Pre-open (before US market opens)
  #   - cron: '0 15 * * 1-5'  # 22:00 ICT
  #   - cron: '0 16 * * 1-5'  # 23:00 ICT
  #   - cron: '0 17 * * 1-5'  # 00:00 ICT
  #   - cron: '0 18 * * 1-5'  # 01:00 ICT
  #   - cron: '0 19 * * 1-5'  # 02:00 ICT
  #   - cron: '0 20 * * 1-5'  # 03:00 ICT
  #   - cron: '15 21 * * 1-5'  # 04:15 ICT - Post-market (after US market closes)
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  fetch-us-market:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Increased for US market size
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          lfs: false
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Fetch US market data
        id: fetch
        run: |
          cd backend
          python main.py --market US --once 2>&1 | tee fetch_log.txt
        env:
          TZ: America/New_York
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      
      - name: Validate data
        if: steps.fetch.outcome == 'success'
        run: |
          cd backend
          python -c "
          import json
          import sys
          from pathlib import Path
          from datetime import datetime
          
          today = datetime.now().strftime('%Y-%m-%d')
          file_path = Path('data') / f'US_{today}.json'
          
          if file_path.exists():
              with open(file_path) as f:
                  data = json.load(f)
                  print(f'✅ United States: {len(data)} stocks fetched')
                  if len(data) < 500:  # US has more stocks
                      print(f'⚠️  Warning: Only {len(data)} stocks (expected >500)')
                      sys.exit(1)
          else:
              print('❌ US data file not found')
              sys.exit(1)
          "
      

      
      # - name: Commit and push database
      #   if: steps.fetch.outcome == 'success'
      #   run: |
      #     echo "Database updated locally (pushed to Supabase direct)"
      
      - name: Create summary
        if: always()
        run: |
          echo "## 🇺🇸 United States Market Fetch" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.fetch.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Fetch Details" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep ">>" backend/src/fetch_log.txt >> $GITHUB_STEP_SUMMARY || echo "No logs captured" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
