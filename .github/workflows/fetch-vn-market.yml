name: Fetch Vietnam Market Data

on:
  # Run at specific times for Vietnam market
  schedule:
    - cron: '30 2 * * 1-5'  # 09:30 ICT - Morning open
    - cron: '30 3 * * 1-5'  # 10:30 ICT
    - cron: '30 4 * * 1-5'  # 11:30 ICT
    - cron: '45 4 * * 1-5'  # 11:45 ICT - Morning close
    - cron: '15 6 * * 1-5'  # 13:15 ICT - Afternoon open
    - cron: '0 7 * * 1-5'  # 14:00 ICT
    - cron: '30 7 * * 1-5'  # 14:30 ICT - Afternoon close
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  fetch-vn-market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          lfs: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd src/api
          pip install -r requirements.txt
      
      - name: Fetch Vietnam market data
        id: fetch
        run: |
          cd src/api
          python main.py --market VN --once 2>&1 | tee fetch_log.txt
        env:
          TZ: Asia/Ho_Chi_Minh
        continue-on-error: true
      
      - name: Validate data
        if: steps.fetch.outcome == 'success'
        run: |
          cd src/api
          python -c "
          import json
          import sys
          from pathlib import Path
          from datetime import datetime
          
          today = datetime.now().strftime('%Y-%m-%d')
          file_path = Path('data') / f'VN_{today}.json'
          
          if file_path.exists():
              with open(file_path) as f:
                  data = json.load(f)
                  print(f'✅ Vietnam: {len(data)} stocks fetched')
                  if len(data) < 50:
                      print(f'⚠️  Warning: Only {len(data)} stocks (expected >50)')
                      sys.exit(1)
          else:
              print('❌ Vietnam data file not found')
              sys.exit(1)
          "
      
      - name: Commit and push database
        if: steps.fetch.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git lfs install
          git add src/api/data/stocks.db
          
          if git diff --staged --quiet; then
            echo "No database changes"
            exit 0
          fi
          
          git commit -m "chore: update database with Vietnam market data $(date +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break || sleep 10; done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create summary
        if: always()
        run: |
          echo "## 🇻🇳 Vietnam Market Fetch" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.fetch.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Fetch Details" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep ">>" src/api/fetch_log.txt >> $GITHUB_STEP_SUMMARY || echo "No logs captured" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
