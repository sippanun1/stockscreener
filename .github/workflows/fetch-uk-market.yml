name: Fetch UK Market Data

on:
  # Run at specific times for UK market
  schedule:
    - cron: '15 8 * * 1-5'  # 15:15 ICT after market opens
    - cron: '15 9 * * 1-5'  # 16:15 ICT
    - cron: '15 10 * * 1-5' # 17:15 ICT
    - cron: '15 11 * * 1-5' # 18:15 ICT
    - cron: '15 12 * * 1-5' # 19:15 ICT
    - cron: '15 13 * * 1-5' # 20:15 ICT
    - cron: '15 14 * * 1-5' # 21:15 ICT
    - cron: '15 15 * * 1-5' # 22:15 ICT
    - cron: '15 16 * * 1-5' # 23:15 ICT
    - cron: '45 16 * * 1-5' # 23:45 ICT - After market closes
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  fetch-uk-market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          lfs: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd src/api
          pip install -r requirements.txt
      
      - name: Fetch UK market data
        id: fetch
        run: |
          cd src/api
          python main.py --market UK --once 2>&1 | tee fetch_log.txt
        env:
          TZ: Europe/London
        continue-on-error: true
      
      - name: Validate data
        if: steps.fetch.outcome == 'success'
        run: |
          cd src/api
          python -c "
          import json
          import sys
          from pathlib import Path
          from datetime import datetime
          
          today = datetime.now().strftime('%Y-%m-%d')
          file_path = Path('data') / f'UK_{today}.json'
          
          if file_path.exists():
              with open(file_path) as f:
                  data = json.load(f)
                  print(f'✅ United Kingdom: {len(data)} stocks fetched')
                  if len(data) < 100:
                      print(f'⚠️  Warning: Only {len(data)} stocks (expected >100)')
                      sys.exit(1)
          else:
              print('❌ UK data file not found')
              sys.exit(1)
          "
      
      - name: Commit and push database
        if: steps.fetch.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git lfs install
          git add src/api/data/stocks.db
          
          if git diff --staged --quiet; then
            echo "No database changes"
            exit 0
          fi
          
          git commit -m "chore: update database with UK market data $(date +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break || sleep 10; done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create summary
        if: always()
        run: |
          echo "## 🇬🇧 United Kingdom Market Fetch" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.fetch.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Fetch Details" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep ">>" src/api/fetch_log.txt >> $GITHUB_STEP_SUMMARY || echo "No logs captured" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
