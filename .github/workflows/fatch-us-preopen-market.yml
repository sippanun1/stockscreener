name: Fetch US Pre Open Market Data

on:
  # Run at 04:15 ICT (21:15 UTC previous day) - 15 min after US market closes
  schedule:
    - cron: '0 14 * * 1-5'  # Monday-Friday only (runs Tue-Sat UTC for Mon-Fri US)
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  fetch-us-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # US market has more stocks
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd src/api
          pip install -r requirements.txt
      
      - name: Fetch US market data
        id: fetch
        run: |
          cd src/api
          python main.py --market US --once
        env:
          TZ: America/New_York
        continue-on-error: true
      
      - name: Validate data
        if: steps.fetch.outcome == 'success'
        run: |
          cd src/api
          python -c "
          import json
          import sys
          from pathlib import Path
          from datetime import datetime
          
          today = datetime.now().strftime('%Y-%m-%d')
          file_path = Path('data') / f'US_{today}.json'
          
          if file_path.exists():
              with open(file_path) as f:
                  data = json.load(f)
                  print(f'✅ United States: {len(data)} stocks fetched')
                  if len(data) < 500:  # US has more stocks
                      print(f'⚠️  Warning: Only {len(data)} stocks (expected >500)')
                      sys.exit(1)
          else:
              print('❌ US data file not found')
              sys.exit(1)
          "
      

      
      - name: Commit and push database
        if: steps.fetch.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/api/data/stocks.db
          
          if git diff --staged --quiet; then
            echo "No database changes"
            exit 0
          fi
          
          git commit -m "chore: update database with US market data $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create summary
        if: always()
        run: |
          echo "## 🇺🇸 United States Market Fetch" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.fetch.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
